<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire du portfolio</title>
<!-- ═══════════════════════════════════════════════════════════════════
     QUESTIONNAIRE DU PORTFOLIO
     Pose une question à la fois ; les réponses produisent `mes-infos.json`,
     que `prisma/seed.ts` injecte en base.

     - Hors ligne : aucune ressource externe, aucune requête réseau.
     - Les réponses sont gardées dans le stockage local de CE navigateur ;
       « Effacer mes réponses », au récapitulatif, les supprime.
     - Les règles de validation reproduisent `prisma/donnees/schema.ts` :
       un fichier accepté ici l'est par le seed.

     ORGANISATION DU SCRIPT
       1. Référentiels et règles de validation
       2. Modèle des éléments de liste (champs exportés)
       3. État, brouillon, reprise d'un ancien brouillon
       4. Composants (champ, options, puces)
       5. Le parcours de questions — `ecrans()` le recalcule à chaque pas,
          car les boucles (« Un autre projet ? ») en changent la longueur
       6. Navigation, récapitulatif, export, import
     ═══════════════════════════════════════════════════════════════ -->
<style>
:root {
  --fond:#f7f5ef; --surface:#ffffff; --surface-2:#faf8f2;
  --bordure:#e5dfd0; --bordure-forte:#d3cbb6;
  --texte:#14130f; --texte-2:#565245; --texte-3:#8b8574;
  --accent:#8a6d1f; --accent-fonce:#6b5417; --accent-doux:#f4ecd6; --accent-trait:#ead9a8;
  --danger:#b42318; --danger-doux:#fef3f2;
  --succes:#067647; --succes-doux:#ecfdf3;
  --r:10px; --r-lg:14px;
  --ombre:0 1px 2px rgba(20,19,15,.05), 0 8px 24px -12px rgba(69,54,16,.18);
  --police:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code","Consolas",monospace;
}
*,*::before,*::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.55 var(--police); min-height:100vh; }
h1,h2,h3,p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* ── En-tête et progression ──────────────────────────────── */
.entete { position:sticky; top:0; z-index:20; background:rgba(247,245,239,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--bordure); }
.entete-contenu { max-width:760px; margin:0 auto; padding:.625rem 1.25rem;
  display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
.marque { display:flex; align-items:center; gap:.625rem; min-width:0; }
.marque b { flex:0 0 auto; width:2.125rem; height:2.125rem; border-radius:9px; display:grid; place-items:center;
  background:linear-gradient(135deg,#b8912b,#d4af37); color:#0d0d0d; font-weight:800; }
.marque div { min-width:0; }
.marque h1 { font-size:.9375rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.marque p { font-size:.75rem; color:var(--texte-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progression { height:3px; background:var(--bordure); }
.progression i { display:block; height:100%; width:0; background:var(--accent); transition:width .35s ease; }

/* ── Écran de question ───────────────────────────────────── */
.scene { max-width:760px; margin:0 auto; padding:clamp(1.75rem,1rem + 4vw,4rem) 1.25rem 4rem; }
.ecran { animation:apparition .28s ease both; }
@keyframes apparition { from { opacity:0; transform:translateY(10px); } }

.surtitre { font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
.question { margin-top:.5rem; font-size:clamp(1.375rem,1.05rem + 1.6vw,2rem); line-height:1.25; font-weight:700;
  letter-spacing:-.01em; overflow-wrap:anywhere; }
.question:focus { outline:none; }
.aide-question { margin-top:.625rem; color:var(--texte-2); max-width:60ch; }
.corps { margin-top:1.75rem; display:grid; gap:1.125rem; }

/* ── Champs ──────────────────────────────────────────────── */
.champ { display:grid; gap:.35rem; min-width:0; }
.champ > label { font-size:.875rem; font-weight:600; }
.champ .requis { color:var(--danger); margin-left:.125rem; }
.champ input:not([type=checkbox]):not([type=range]), .champ select, .champ textarea {
  width:100%; min-width:0; padding:.75rem .875rem; border-radius:var(--r);
  border:1px solid var(--bordure-forte); background:var(--surface); font-size:1.0625rem;
  transition:border-color .15s, box-shadow .15s;
}
.seul input:not([type=checkbox]):not([type=range]) { font-size:1.25rem; padding:.875rem 1rem; }
.champ textarea { min-height:7.5rem; resize:vertical; line-height:1.5; }
.champ input:focus, .champ select:focus, .champ textarea:focus {
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(138,109,31,.16);
}
.champ .aide { font-size:.8125rem; color:var(--texte-3); }
.champ .message { font-size:.8125rem; color:var(--danger); font-weight:500; }
.champ.invalide input, .champ.invalide select, .champ.invalide textarea { border-color:var(--danger); }

.bascule { display:flex; align-items:center; gap:.625rem; cursor:pointer; user-select:none; }
.bascule input { width:1.25rem; height:1.25rem; accent-color:var(--accent); flex:0 0 auto; }

.jauge { display:flex; align-items:center; gap:.75rem; }
.jauge input { flex:1; accent-color:var(--accent); min-width:0; }
.jauge output { font-family:var(--mono); font-size:.875rem; min-width:4.5ch; text-align:right; }

.grille { display:grid; gap:1.125rem 1rem; }
@media (min-width:600px) { .grille.deux { grid-template-columns:1fr 1fr; } .grille.deux .large { grid-column:1/-1; } }

/* ── Options (réponse unique) ────────────────────────────── */
.options { display:grid; gap:.625rem; }
.option { display:flex; align-items:center; gap:.875rem; width:100%; text-align:left;
  padding:.9375rem 1.125rem; border-radius:12px; border:1px solid var(--bordure-forte); background:var(--surface);
  font-size:1.0625rem; font-weight:500; transition:border-color .15s, background .15s; }
.option:hover { border-color:var(--accent); }
.option kbd { flex:0 0 auto; width:1.75rem; height:1.75rem; display:grid; place-items:center; border-radius:6px;
  border:1px solid var(--bordure-forte); font:600 .8125rem var(--police); color:var(--texte-2); background:var(--surface-2); }
.option span { min-width:0; }
.option small { display:block; font-size:.8125rem; color:var(--texte-3); font-weight:400; margin-top:.125rem; }
.option[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-doux); }
.option[aria-pressed="true"] kbd { background:var(--accent); border-color:var(--accent); color:#fff; }

/* ── Puces (réponses multiples, suggestions) ─────────────── */
.puces { display:flex; flex-wrap:wrap; gap:.5rem; }
.puce { padding:.5rem .875rem; border-radius:999px; border:1px solid var(--bordure-forte); background:var(--surface);
  font-size:.9375rem; transition:all .15s; }
.puce:hover { border-color:var(--accent); color:var(--accent); }
.puce[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
.exemples { display:flex; flex-wrap:wrap; gap:.375rem; align-items:center; }
.exemples > span { font-size:.8125rem; color:var(--texte-3); margin-right:.125rem; }
.exemples .puce { font-size:.8125rem; padding:.3rem .65rem; }

/* ── Blocs ───────────────────────────────────────────────── */
.carte { background:var(--surface); border:1px solid var(--bordure); border-radius:var(--r-lg);
  box-shadow:var(--ombre); padding:1.125rem; }
.carte-tete { display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.875rem; }
.carte-tete h3 { font-size:1rem; min-width:0; overflow-wrap:anywhere; }
.rangee { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.625rem; align-items:end;
  padding:.875rem; border:1px solid var(--bordure); border-radius:var(--r); background:var(--surface-2); }
.rangee .grille { gap:.75rem; }
@media (min-width:600px) { .rangee .grille { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }

.liste-resume { list-style:none; margin:0; padding:0; display:grid; gap:.5rem; }
.liste-resume li { display:flex; align-items:center; justify-content:space-between; gap:.75rem;
  padding:.625rem .875rem; border-radius:var(--r); background:var(--surface); border:1px solid var(--bordure); }
.liste-resume li span { min-width:0; overflow-wrap:anywhere; }

.note { padding:.75rem .9375rem; border-radius:var(--r); font-size:.9375rem; background:var(--accent-doux);
  border:1px solid var(--accent-trait); color:var(--texte); }
.note.ko { background:var(--danger-doux); border-color:#fecdca; color:var(--danger); }
.note.ok { background:var(--succes-doux); border-color:#abefc6; color:var(--succes); }

/* ── Boutons ─────────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.75rem 1.25rem;
  border-radius:var(--r); border:1px solid var(--bordure-forte); background:var(--surface);
  font-weight:600; font-size:.9375rem; transition:background .15s, border-color .15s, color .15s; }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn-plein { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-plein:hover { background:var(--accent-fonce); border-color:var(--accent-fonce); color:#fff; }
.btn-discret { border-color:transparent; background:none; padding:.5rem .75rem; color:var(--texte-2); }
.btn-petit { padding:.4rem .75rem; font-size:.8125rem; }
.btn-lien { border:none; background:none; padding:0; color:var(--accent); font-weight:600; font-size:.875rem;
  text-decoration:underline; text-underline-offset:2px; flex:0 0 auto; }
.btn-lien.danger { color:var(--danger); }
.btn-ajout { border-style:dashed; color:var(--accent); width:100%; }

.nav-ecran { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-top:2.25rem; flex-wrap:wrap; }
.nav-ecran .droite { display:flex; align-items:center; gap:.875rem; margin-left:auto; }
.indice { font-size:.8125rem; color:var(--texte-3); }
@media (hover:none) { .indice { display:none; } }

/* ── Récapitulatif ───────────────────────────────────────── */
.recap { display:grid; gap:.875rem; }
.recap .carte-tete { margin-bottom:.5rem; }
.recap dl { margin:0; display:grid; gap:.375rem; }
.recap dl div { display:grid; gap:.125rem; }
@media (min-width:600px) { .recap dl div { grid-template-columns:11rem minmax(0,1fr); gap:1rem; } }
.recap dt { font-size:.8125rem; color:var(--texte-3); }
.recap dd { margin:0; overflow-wrap:anywhere; }
.etat { font-size:.8125rem; font-weight:600; }
.etat.garde { color:var(--texte-3); }
.etat.vide { color:var(--danger); }
.erreurs { list-style:none; margin:.875rem 0 0; padding:0; display:grid; gap:.375rem; }
.erreurs button { width:100%; text-align:left; padding:.5rem .75rem; border-radius:8px;
  border:1px solid #fecdca; background:var(--danger-doux); color:var(--danger); font-size:.875rem; }
pre.commande { margin:.375rem 0 0; padding:.625rem .75rem; border-radius:8px; background:#1a1a1a; color:#f7f3e8;
  font:.8125rem/1.5 var(--mono); overflow-x:auto; white-space:pre; }
.etapes { margin:0; padding-left:1.25rem; display:grid; gap:.875rem; }

/* ── Sommaire ────────────────────────────────────────────── */
dialog { border:none; border-radius:var(--r-lg); padding:0; width:min(26rem,calc(100% - 2rem));
  box-shadow:0 24px 60px -20px rgba(20,19,15,.45); color:var(--texte); }
dialog::backdrop { background:rgba(20,19,15,.35); }
.sommaire-tete { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.125rem;
  border-bottom:1px solid var(--bordure); }
.sommaire-liste { list-style:none; margin:0; padding:.5rem; max-height:60vh; overflow-y:auto; }
.sommaire-liste button { width:100%; display:flex; justify-content:space-between; gap:.75rem; text-align:left;
  padding:.625rem .75rem; border:none; border-radius:8px; background:none; }
.sommaire-liste button:hover { background:var(--surface-2); }
.sommaire-liste button[aria-current="true"] { background:var(--accent-doux); font-weight:600; }
.sommaire-liste .fait { color:var(--succes); font-size:.8125rem; }
.sommaire-pied { display:flex; flex-wrap:wrap; gap:.5rem; padding:.875rem 1.125rem; border-top:1px solid var(--bordure); }

.toast { position:fixed; left:50%; bottom:1.25rem; transform:translateX(-50%) translateY(1rem); opacity:0;
  background:#14130f; color:#fff; padding:.625rem 1rem; border-radius:var(--r); font-size:.875rem;
  transition:opacity .2s, transform .2s; pointer-events:none; z-index:30; max-width:calc(100% - 2rem); }
.toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }

@media (prefers-reduced-motion:reduce) {
  .ecran { animation:none; }
  *,*::before,*::after { transition:none !important; }
}
</style>
</head>
<body>

<header class="entete">
  <div class="entete-contenu">
    <div class="marque">
      <b aria-hidden="true">S</b>
      <div>
        <h1>Questionnaire du portfolio</h1>
        <p id="etat-brouillon" aria-live="polite">Réponses gardées dans ce navigateur</p>
      </div>
    </div>
    <button class="btn btn-discret" type="button" id="btn-sommaire" aria-haspopup="dialog">Sommaire</button>
  </div>
  <div class="progression" role="progressbar" aria-label="Avancement du questionnaire" aria-valuemin="0" aria-valuemax="100" id="progression"><i id="barre"></i></div>
</header>

<main class="scene"><section class="ecran" id="ecran"></section></main>

<dialog id="sommaire" aria-labelledby="titre-sommaire">
  <div class="sommaire-tete">
    <h2 id="titre-sommaire" style="font-size:1rem">Sommaire</h2>
    <button class="btn btn-discret btn-petit" type="button" id="fermer-sommaire">Fermer</button>
  </div>
  <ul class="sommaire-liste" id="sommaire-liste"></ul>
  <div class="sommaire-pied">
    <button class="btn btn-petit" type="button" id="btn-importer">Reprendre depuis un fichier</button>
  </div>
</dialog>

<input type="file" id="fichier-import" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  /* ═══ 1. RÉFÉRENTIELS ═════════════════════════════════════════════
     Noms d'icônes lucide-react, vérifiés sur la version installée. */
  const ICONES_SERVICES = [
    ["Code", "Code — développement"], ["Layers", "Couches — full stack"], ["Smartphone", "Mobile"],
    ["Monitor", "Écran — web"], ["Server", "Serveur — back-end"], ["Database", "Base de données"],
    ["Cloud", "Cloud"], ["Workflow", "Automatisation"], ["Terminal", "Terminal — DevOps"],
    ["ShieldCheck", "Bouclier — sécurité"], ["Lock", "Cadenas"], ["KeyRound", "Clé — cryptographie"],
    ["Fingerprint", "Empreinte — identité"], ["Bug", "Bug — audit"], ["Network", "Réseau"],
    ["Router", "Routeur"], ["Wifi", "Wi-Fi"], ["Brain", "Cerveau — IA"], ["Bot", "Robot — IA"],
    ["Sparkles", "Étincelles"], ["Cpu", "Processeur"], ["LineChart", "Courbe — données"],
    ["Palette", "Palette — design"], ["PenTool", "Plume — UI"], ["Search", "Recherche — SEO"],
    ["Rocket", "Fusée — lancement"], ["Zap", "Éclair — performance"], ["Wrench", "Clé — maintenance"],
    ["GraduationCap", "Formation"], ["Globe", "Globe"]
  ];
  // [nom affiché, icône, exemple d'adresse]
  const PLATEFORMES = [
    ["GitHub", "Github", "https://github.com/ton-compte"],
    ["LinkedIn", "Linkedin", "https://www.linkedin.com/in/ton-profil"],
    ["X (Twitter)", "X", "https://x.com/ton-compte"],
    ["Instagram", "Instagram", "https://www.instagram.com/ton-compte"],
    ["Facebook", "Facebook", "https://www.facebook.com/ton-compte"],
    ["YouTube", "Youtube", "https://www.youtube.com/@ta-chaine"],
    ["GitLab", "Gitlab", "https://gitlab.com/ton-compte"],
    ["Dribbble", "Dribbble", "https://dribbble.com/ton-compte"],
    ["Figma", "Figma", "https://www.figma.com/@ton-compte"],
    ["CodePen", "Codepen", "https://codepen.io/ton-compte"],
    ["WhatsApp", "Whatsapp", "https://wa.me/2250700000000"],
    ["Telegram", "Send", "https://t.me/ton-compte"],
    ["E-mail", "Mail", "mailto:toi@exemple.com"]
  ];
  const ICONES_RESEAUX = [...new Set(PLATEFORMES.map((p) => p[1]))].map((n) => [n, n])
    .concat([["Globe", "Globe"], ["Link", "Link"], ["Rss", "Rss"], ["BookOpen", "BookOpen"], ["AtSign", "AtSign"], ["Phone", "Phone"]]);
  const DOMAINES = ["Frontend", "Backend", "Mobile", "DevOps", "Cloud", "Sécurité", "Cryptographie", "Réseau", "IA", "Data", "Outils"];

  // Miroir de `src/lib/sections.ts` : [id, libellé, liste qui l'alimente]
  const SECTIONS_SITE = [
    ["about", "À propos", null], ["services", "Services", "services"], ["skills", "Compétences", "competences"],
    ["experience", "Parcours", "parcours"], ["projects", "Projets", "projets"], ["publications", "Publications", "publications"],
    ["blog", "Blog", "articles"], ["faq", "FAQ", "faq"], ["testimonials", "Témoignages", "temoignages"], ["contact", "Contact", null]
  ];

  const CHAPITRES = [
    ["toi", "Toi"], ["contact", "Te joindre"], ["visuels", "Images et CV"], ["chiffres", "Tes chiffres"],
    ["reseaux", "Réseaux"], ["services", "Services"], ["competences", "Compétences"], ["parcours", "Parcours"],
    ["projets", "Projets"], ["publications", "Publications"], ["articles", "Blog"], ["faq", "FAQ"],
    ["temoignages", "Témoignages"], ["site", "Ton site"], ["recap", "Récapitulatif"]
  ];
  const LISTES = ["reseaux", "services", "competences", "parcours", "projets", "publications", "articles", "faq", "temoignages"];

  /* Règles de validation : reproduction de `prisma/donnees/schema.ts`. */
  const R = {
    lien: (v) => {
      if (v.charAt(0) === "/") return v.charAt(1) !== "/";
      try { return ["https:", "http:"].includes(new URL(v).protocol); } catch (e) { return false; }
    },
    lienReseau: (v) => { try { return ["https:", "http:", "mailto:"].includes(new URL(v).protocol); } catch (e) { return false; } },
    email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
    mois: (v) => /^\d{4}-(0[1-9]|1[0-2])$/.test(v),
    jour: (v) => /^\d{4}-\d{2}-\d{2}$/.test(v)
  };
  const MSG = {
    requis: "Cette réponse est nécessaire.",
    lien: "Il faut une adresse https:// ou un chemin commençant par / (par exemple /images/moi.png).",
    lienReseau: "Il faut une adresse https:// ou mailto:.",
    email: "Cette adresse e-mail n'a pas l'air valide.",
    mois: "Indique le mois au format AAAA-MM.",
    jour: "Indique la date au format AAAA-MM-JJ."
  };
  const decouper = (s) => String(s || "").split(",").map((x) => x.trim()).filter(Boolean);

  function erreurChamp(def, v) {
    const s = typeof v === "string" ? v.trim() : v;
    if (def.type === "bool") return "";
    if (def.requis && !s) return MSG.requis;
    if (!s) return "";
    switch (def.type) {
      case "email": return R.email(s) ? "" : MSG.email;
      case "lien": return R.lien(s) ? "" : MSG.lien;
      case "lienReseau": return R.lienReseau(s) ? "" : MSG.lienReseau;
      case "mois": return R.mois(s) ? "" : MSG.mois;
      case "jour": return R.jour(s) ? "" : MSG.jour;
      case "listeLiens": {
        const mauvais = decouper(s).filter((x) => !R.lien(x));
        return mauvais.length ? "Lien invalide : " + mauvais[0] + ". " + MSG.lien : "";
      }
      case "entier": case "niveau": {
        if (!/^\d+$/.test(s)) return "Il faut un nombre entier.";
        const n = Number(s);
        if (def.min !== undefined && n < def.min) return "Au minimum " + def.min + ".";
        if (def.max !== undefined && n > def.max) return "Au maximum " + def.max + ".";
        return "";
      }
    }
    return "";
  }

  function erreursCroisees(liste, x) {
    const r = {};
    if (liste === "parcours" && !x.current) {
      if (!String(x.endDate || "").trim()) r.endDate = "Indique quand cette étape s'est terminée, ou coche « J'y suis encore ».";
      else if (R.mois(x.startDate) && R.mois(x.endDate) && x.endDate < x.startDate) r.endDate = "La fin tombe avant le début.";
    }
    return r;
  }

  /* ═══ 2. MODÈLE DES ÉLÉMENTS DE LISTE ═════════════════════════════
     Tous les champs EXPORTÉS, avec leur type. `cache` : exporté avec sa
     valeur par défaut mais jamais demandé. `omettre` : retiré du fichier
     si vide (champs que le schéma accepte absents, pas nuls). Le libellé
     peut dépendre de l'élément (parcours : poste ou diplôme). */
  const estFormation = (x) => x.type === "education";
  const MODELE = {
    reseaux: {
      nouveau: () => ({ platform: "", url: "", iconName: "Globe", active: true, perso: true }),
      champs: [
        { cle: "platform", label: "Nom du réseau", type: "texte", requis: true },

    temoignages: {

      ] }

  const champsVisibles = (liste, x) => MODELE[liste].champs.filter((c) => !c.cache && (!c.visible || c.visible(x)));
  const libelle = (def, x) => (typeof def.label === "function" ? def.label(x) : def.label) || "";

  /* ═══ 3. ÉTAT ═════════════════════════════════════════════════════
     Valeurs en chaînes et booléens ; mise au format du seed à l'export.
     `choix[liste]` : "oui" (les éléments saisis), "non" (liste vidée),
     "garder" (section non touchée) ou absent (pas encore répondu — la
     section n'est pas touchée non plus). */
  const CLE = "portfolio-questionnaire-v1";
  const ANCIENNE_CLE = "portfolio-formulaire-seed-v1";

  function etatVide() {
    const e = {
      profil: { name: "", title: "", bio: "", email: "", phone: "", location: "", photoUrl: "", aboutPhotoUrl: "", logoUrl: "", cvUrl: "", isAvailable: null },
      parametres: { site_name: "", stats_projects: "", stats_years: "", stats_techs: "" },
      sections: null,           // null : visibilité déduite du contenu
      listes: {}, choix: {}, domaines: [],
      position: "intro"
    };
    LISTES.forEach((l) => { e.listes[l] = []; });
    return e;
  }

  function normaliser(lu) {
    const e = etatVide();
    Object.assign(e.profil, lu.profil || {});
    Object.keys(e.parametres).forEach((k) => { if (lu.parametres && lu.parametres[k] !== undefined) e.parametres[k] = String(lu.parametres[k]); });
    if (lu.sections) e.sections = Object.assign({}, lu.sections);
    LISTES.forEach((l) => {
      if (lu.listes && Array.isArray(lu.listes[l])) e.listes[l] = lu.listes[l].map((x) => Object.assign(MODELE[l].nouveau(x && x.type), x));
      if (lu.choix && ["oui", "non", "garder"].includes(lu.choix[l])) e.choix[l] = lu.choix[l];
    });
    e.domaines = Array.isArray(lu.domaines) ? lu.domaines.filter((d) => typeof d === "string") : [];
    e.listes.competences.forEach((c) => { if (c.category && !e.domaines.includes(c.category)) e.domaines.push(c.category); });
    if (typeof lu.position === "string") e.position = lu.position;
    if (typeof lu.positionPrecedente === "string") e.positionPrecedente = lu.positionPrecedente;
    return e;
  }

  function charger() {
    try {
      const brut = localStorage.getItem(CLE);
      if (brut) return normaliser(JSON.parse(brut));
      // Reprise d'un brouillon de l'ancien formulaire, s'il en existe un.
      const ancien = localStorage.getItem(ANCIENNE_CLE);
      if (ancien) {
        const a = JSON.parse(ancien);
        const choix = {};
        LISTES.forEach((l) => {
          if (a.inclure && a.inclure[l] === false) choix[l] = "garder";
          else if (a.listes && a.listes[l] && a.listes[l].length) choix[l] = "oui";
        });
        return normaliser({ profil: a.profil, parametres: a.parametres, sections: a.parametres && a.parametres.sections,
          listes: a.listes, choix: choix, position: "recap" });
      }
    } catch (err) { /* brouillon illisible : on repart de zéro */ }
    return null;
  }

  let etat = charger() || etatVide();
  let touches = {};

  let minuteur = null;
  function sauvegarder() {
    clearTimeout(minuteur);
    minuteur = setTimeout(() => {
      const zone = document.getElementById("etat-brouillon");
      try {
        localStorage.setItem(CLE, JSON.stringify(etat));
        const h = new Date();
        zone.textContent = "Réponses enregistrées à " + String(h.getHours()).padStart(2, "0") + ":" + String(h.getMinutes()).padStart(2, "0");
      } catch (err) {
        zone.textContent = "Réponses non enregistrées ici — pense à télécharger le fichier";
      }
    }, 350);
  }

  /* ═══ 4. COMPOSANTS ═══════════════════════════════════════════════
     Les réponses ne passent JAMAIS par innerHTML : `value` et
     `textContent` uniquement. */
  function el(tag, attrs, ...enfants) {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v === undefined || v === null || v === false) return;
      if (k === "texte") n.textContent = v;
      else if (k === "classe") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    enfants.forEach((c) => { if (c !== null && c !== undefined && c !== false) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  let compteurId = 0;
  const nouvelId = () => "q" + (++compteurId);

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("visible");
    clearTimeout(toast.m);
    toast.m = setTimeout(() => t.classList.remove("visible"), 2600);
  }

  /* Quitter un champ invalide affiche son message, qui décale ce qui
     suit. `blur` survenant au `mousedown`, le bouton visé glissait sous le
     pointeur avant le `mouseup` et le clic était perdu. Pendant un geste
     du pointeur, l'affichage attend donc la fin du clic. */
  let pointeurEnfonce = false;
  const differes = [];
  document.addEventListener("pointerdown", () => { pointeurEnfonce = true; }, true);
  document.addEventListener("pointerup", () => {
    setTimeout(() => { pointeurEnfonce = false; differes.splice(0).forEach((fn) => fn()); }, 0);
  }, true);
  const apresGeste = (fn) => { if (pointeurEnfonce) differes.push(fn); else fn(); };

  /**
   * Champ lié à `objet[def.cle]`. `entree.seul` : le libellé est la
   * question elle-même, lue par les lecteurs d'écran mais masquée.
   */
  function construireChamp(entree) {
    const { def, objet, cleTouche, croise, apresSaisie, seul, question } = entree;
    const id = nouvelId();
    const texteLabel = seul ? question : libelle(def, objet);
    const boite = el("div", { classe: "champ" + (seul ? " seul" : "") + (def.large ? " large" : ""), "data-champ": cleTouche });
    const message = el("p", { classe: "message", id: id + "-m", hidden: true });
    let saisie;

    const afficher = () => {
      const m = erreurChamp(def, objet[def.cle]) || (croise ? croise()[def.cle] : "");
      const visible = !!m && !!touches[cleTouche];
      boite.classList.toggle("invalide", visible);
      message.hidden = !visible;
      message.textContent = visible ? m : "";
      if (saisie) saisie.setAttribute("aria-invalid", visible ? "true" : "false");
      return m;
    };
    const changer = (v) => {
      objet[def.cle] = v;
      afficher();
      if (apresSaisie) apresSaisie(def.cle);
      sauvegarder();
    };

    if (def.type === "bool") {
      saisie = el("input", { type: "checkbox", id });
      saisie.checked = !!objet[def.cle];
      saisie.addEventListener("change", () => changer(saisie.checked));
      boite.appendChild(el("label", { classe: "bascule", for: id }, saisie, texteLabel));
      boite.afficher = afficher;
      return boite;
    }

    boite.appendChild(el("label", { for: id, classe: seul ? "sr-only" : null }, texteLabel,
      def.requis && !seul ? el("span", { classe: "requis", "aria-hidden": "true", texte: "*" }) : null));

    if (def.type === "zone") {
      saisie = el("textarea", { id, rows: def.grand ? 12 : 4 });
    } else if (def.type === "choix") {
      saisie = el("select", { id });
      def.options.forEach((o) => saisie.appendChild(el("option", { value: o[0], texte: o[1] })));
    } else if (def.type === "niveau") {
      const sortie = el("output", { for: id });
      saisie = el("input", { type: "range", id, min: def.min, max: def.max, step: 5 });
      saisie.value = objet[def.cle] || "0";
      sortie.textContent = saisie.value + " %";
      saisie.addEventListener("input", () => { sortie.textContent = saisie.value + " %"; changer(saisie.value); });
      boite.appendChild(el("div", { classe: "jauge" }, saisie, sortie));
      boite.appendChild(message);
      boite.afficher = afficher;
      boite.saisie = saisie;
      return boite;
    } else {
      const types = { email: "email", tel: "tel", mois: "month", jour: "date", entier: "number" };
      saisie = el("input", { type: types[def.type] || "text", id });
      if (def.type === "entier") { saisie.setAttribute("inputmode", "numeric"); saisie.min = def.min !== undefined ? def.min : 0; }
      if (["lien", "lienReseau", "listeLiens"].includes(def.type)) { saisie.setAttribute("inputmode", "url"); saisie.setAttribute("spellcheck", "false"); saisie.setAttribute("autocapitalize", "off"); }
      if (def.type === "mois") saisie.placeholder = "AAAA-MM";
      if (def.placeholder) saisie.placeholder = def.placeholder;
      if (def.autocomplete) saisie.setAttribute("autocomplete", def.autocomplete);
    }

    saisie.value = objet[def.cle] === undefined || objet[def.cle] === null ? "" : objet[def.cle];
    saisie.addEventListener(def.type === "choix" ? "change" : "input", () => changer(saisie.value));
    saisie.addEventListener("blur", () => { touches[cleTouche] = true; apresGeste(afficher); });
    saisie.setAttribute("aria-describedby", (def.aide ? id + "-a " : "") + id + "-m");
    boite.appendChild(saisie);

    if (def.exemples) {
      const zone = el("div", { classe: "exemples" }, el("span", { texte: "Par exemple :" }));
      def.exemples.forEach((ex) => zone.appendChild(el("button", { classe: "puce", type: "button", texte: ex,
        onclick: () => { saisie.value = ex; changer(ex); saisie.focus(); } })));
      boite.appendChild(zone);
    }
    if (def.aide) boite.appendChild(el("p", { classe: "aide", id: id + "-a", texte: def.aide }));
    boite.appendChild(message);
    boite.afficher = afficher;
    boite.saisie = saisie;
    return boite;
  }

  /** Réponses uniques, activables aussi par les touches A, B, C… */
  function options(liste) {
    const zone = el("div", { classe: "options", role: "group" });
    liste.forEach((o, i) => {
      zone.appendChild(el("button", { classe: "option", type: "button", "aria-pressed": o.actif ? "true" : "false",
        "data-touche": String.fromCharCode(65 + i), onclick: o.action },
        el("kbd", { texte: String.fromCharCode(65 + i), "aria-hidden": "true" }),
        el("span", {}, o.texte, o.detail ? el("small", { texte: o.detail }) : null)));
    });
    return zone;
  }

  function puces(liste) {
    const zone = el("div", { classe: "puces", role: "group" });
    liste.forEach((p) => zone.appendChild(el("button", { classe: "puce", type: "button", "aria-pressed": p.actif ? "true" : "false",
      texte: p.texte, onclick: p.action })));
    return zone;
  }

  /* ═══ 5. LE PARCOURS DE QUESTIONS ═════════════════════════════════
     Chaque écran : cle, chap, question, aide, et soit `champs` (liste de
     { def, objet, cleTouche, croise }), soit `rendu(corps)` sur mesure.
     `valider()` renvoie un message bloquant, `sansSuivant` masque le
     bouton « Continuer » (réponses par options). `ecrans()` n'a AUCUN
     effet de bord : on peut l'appeler autant qu'on veut. */
  function champ(objet, def, cleEcran, croise) {
    return { def, objet, cleTouche: cleEcran + ":" + def.cle, croise };
  }
  const profilChamp = (cleEcran, def) => champ(etat.profil, def, cleEcran);

  function ecrans() {
    const L = [];
    const e = etat;

    L.push({ cle: "intro", chap: "intro", rendu: rIntro, sansNav: true });

    // ── Toi ─────────────────────────────────────────────────
    L.push({ cle: "nom", chap: "toi", question: "Pour commencer, comment t'appelles-tu ?",
      aide: "Ton nom tel qu'il s'affichera en grand sur la page d'accueil.",
      champs: [profilChamp("nom", { cle: "name", type: "texte", requis: true, autocomplete: "name" })] });
    L.push({ cle: "titre", chap: "toi", question: "Quel titre professionnel veux-tu afficher sous ton nom ?",
      aide: "Une ligne courte, qui dit ce que tu fais.",
      champs: [profilChamp("titre", { cle: "title", type: "texte", requis: true,
        exemples: ["Développeur Full Stack", "Ingénieur DevSecOps", "Développeur Web & Mobile", "Consultant en cybersécurité"] })] });
    L.push({ cle: "bio", chap: "toi", question: "Présente-toi en quelques phrases.",
      aide: "Ce que tu fais, pour qui, et ce qui te distingue. Ce texte apparaît dans l'accueil et dans la section « À propos ».",
      champs: [profilChamp("bio", { cle: "bio", type: "zone", requis: true })] });
    L.push({ cle: "lieu", chap: "toi", question: "Où es-tu basé ?", aide: "Ville et pays, par exemple : Abidjan, Côte d'Ivoire.",
      champs: [profilChamp("lieu", { cle: "location", type: "texte", autocomplete: "address-level2" })] });

    // ── Te joindre ──────────────────────────────────────────
    L.push({ cle: "contact", chap: "contact", question: "Comment les visiteurs peuvent-ils te joindre ?",
      aide: "Affichés dans la section Contact. Laisse vide ce que tu ne veux pas montrer.",
      champs: [
        profilChamp("contact", { cle: "email", label: "Ton adresse e-mail", type: "email", autocomplete: "email" }),
        profilChamp("contact", { cle: "phone", label: "Ton numéro de téléphone", type: "tel", autocomplete: "tel", placeholder: "+225 07 00 00 00 00" })
      ] });

    // ── Images et CV ────────────────────────────────────────
    const aideFichier = "Dépose le fichier dans le dossier public/images du projet, puis indique son chemin. Une adresse https:// fonctionne aussi.";
    L.push({ cle: "photo", chap: "visuels", question: "As-tu une photo de toi pour la page d'accueil ?",
      aide: "Idéalement détourée, sur fond transparent (PNG). " + aideFichier,
      champs: [profilChamp("photo", { cle: "photoUrl", type: "lien", placeholder: "/images/moi.png" })] });
    L.push({ cle: "illustration", chap: "visuels", question: "Et une image ou une illustration pour la section « À propos » ?",
      aide: "Elle s'affiche en entier, sans être recadrée ; un format vertical (4/5) rend le mieux. " + aideFichier,
      champs: [profilChamp("illustration", { cle: "aboutPhotoUrl", type: "lien", placeholder: "/images/illustration.png" })] });
    L.push({ cle: "logo", chap: "visuels", question: "As-tu un logo ?", aide: aideFichier,
      champs: [profilChamp("logo", { cle: "logoUrl", type: "lien", placeholder: "/images/logo.png" })] });
    L.push({ cle: "cv", chap: "visuels", question: "Veux-tu proposer ton CV en téléchargement ?",
      aide: "Dépose le PDF dans le dossier public du projet, puis indique son chemin.",
      champs: [profilChamp("cv", { cle: "cvUrl", type: "lien", placeholder: "/cv.pdf" })] });

    // ── Tes chiffres ────────────────────────────────────────
    L.push({ cle: "chiffres", chap: "chiffres", question: "Quelques chiffres pour la section « À propos » ?",
      aide: "Ils s'affichent sous forme de compteurs animés. Laisse vide ce que tu ne veux pas modifier.",
      champs: [
        champ(e.parametres, { cle: "stats_projects", label: "Combien de projets as-tu réalisés ?", type: "entier", min: 0 }, "chiffres"),
        champ(e.parametres, { cle: "stats_years", label: "Depuis combien d'années exerces-tu ?", type: "entier", min: 0 }, "chiffres"),
        champ(e.parametres, { cle: "stats_techs", label: "Combien de technologies maîtrises-tu ?", type: "entier", min: 0 }, "chiffres")
      ] });

    // ── Réseaux ─────────────────────────────────────────────
    L.push(ecranChoix("reseaux", "Veux-tu afficher tes réseaux sociaux sur le site ?",
      "Ils apparaissent sous forme d'icônes sous ton nom et dans le pied de page.",
      ["Oui, je choisis lesquels", "Non, aucun réseau", "Garder ceux déjà en ligne"]));
    if (e.choix.reseaux === "oui") {
      L.push({ cle: "reseaux.lesquels", chap: "reseaux", question: "Sur quels réseaux peut-on te trouver ?",
        aide: "Sélectionne-les tous ; je te demanderai ensuite les adresses.",
        valider: () => e.listes.reseaux.length ? "" : "Choisis au moins un réseau, ou reviens en arrière et réponds « aucun ».",
        rendu: rReseaux });
      L.push({ cle: "reseaux.liens", chap: "reseaux", question: "Donne-moi l'adresse de chacun de tes profils.",
        aide: "Copie-la depuis la barre d'adresse de ton navigateur, sur ta page de profil.",
        champs: e.listes.reseaux.flatMap((x, i) => {
          const base = "reseaux." + i;
          const preset = PLATEFORMES.find((p) => p[0] === x.platform);
          const url = champ(x, Object.assign({}, MODELE.reseaux.champs[1], {
            label: x.perso ? "Adresse du profil" : "Ton profil " + x.platform,
            placeholder: preset ? preset[2] : "https://"
          }), base);
          return x.perso ? [champ(x, MODELE.reseaux.champs[0], base), url, champ(x, MODELE.reseaux.champs[2], base)] : [url];
        }),
        rendu: rLiensReseaux });
    }

    // ── Services ────────────────────────────────────────────
    boucle(L, "services", {
      choix: ["Proposes-tu des services à des clients ?", "Ils apparaissent sous forme de cartes dans la section « Ce que je propose ».",
        ["Oui, je vais les décrire", "Non, pas de services", "Garder ceux déjà en ligne"]],
      item: (i) => "Service n°" + (i + 1) + " : de quoi s'agit-il ?",
      encore: "Proposes-tu un autre service ?",
      resume: (x) => x.title,
      ajouts: [["Oui, en ajouter un"]]
    });

    // ── Compétences ─────────────────────────────────────────
    L.push(ecranChoix("competences", "Veux-tu présenter tes compétences techniques ?",
      "Elles s'affichent par domaine, avec une jauge de niveau ; chaque domaine devient un filtre sur le site.",
      ["Oui, je vais les lister", "Non", "Garder celles déjà en ligne"]));
    if (e.choix.competences === "oui") {
      L.push({ cle: "competences.domaines", chap: "competences", question: "Dans quels domaines as-tu des compétences ?",
        aide: "Sélectionne-les tous, ou ajoute le tien.",
        valider: () => e.domaines.length ? "" : "Choisis au moins un domaine.",
        rendu: rDomaines });
      e.domaines.forEach((d) => {
        const items = e.listes.competences.map((x, i) => [x, i]).filter(([x]) => x.category === d);
        L.push({ cle: "competences.d." + d, chap: "competences",
          question: "Quelles technologies maîtrises-tu en « " + d + " », et à quel niveau ?",
          aide: "Le niveau s'affiche sous forme de jauge, de 0 à 100 %.",
          valider: () => items.length ? "" : "Ajoute au moins une compétence, ou retire ce domaine à la question précédente.",
          champs: items.flatMap(([x, i]) => MODELE.competences.champs.filter((c) => !c.cache).map((c) => champ(x, c, "competences." + i))),
          rendu: (corps, ecran, construire) => rDomaine(corps, d, items, ecran, construire) });
      });
    }

    // ── Parcours ────────────────────────────────────────────
    boucle(L, "parcours", {
      choix: ["Veux-tu présenter ton parcours ?", "Tes expériences professionnelles et tes formations. Le site les classe de la plus récente à la plus ancienne.",
        ["Oui, je vais le décrire", "Non", "Garder celui déjà en ligne"]],
      premier: "Par quoi commences-tu ?",
      item: (i, x) => (estFormation(x) ? "Formation" : "Expérience") + " n°" + (i + 1) + (estFormation(x) ? " : parle-moi de cette formation." : " : parle-moi de ce poste."),
      encore: "Veux-tu ajouter une autre étape à ton parcours ?",
      resume: (x) => [x.title, x.organization].filter(Boolean).join(" — "),
      ajouts: [["Oui, une expérience professionnelle", "work"], ["Oui, une formation", "education"]]
    });

    // ── Projets ─────────────────────────────────────────────
    boucle(L, "projets", {
      choix: ["Veux-tu présenter tes projets ?", "Ils s'affichent sous forme de cartes ; ceux que tu mets en avant passent en premier.",
        ["Oui, je vais les décrire", "Non", "Garder ceux déjà en ligne"]],
      item: (i) => i === 0 ? "Parle-moi d'un projet dont tu es fier." : "Parle-moi de ton projet n°" + (i + 1) + ".",
      encore: "As-tu un autre projet à présenter ?",
      resume: (x) => x.title,
      ajouts: [["Oui, en ajouter un"]]
    });

    // ── Publications ────────────────────────────────────────
    boucle(L, "publications", {
      choix: ["As-tu publié des contenus ailleurs que tu veux mettre en avant ?", "Un post LinkedIn, un dépôt GitHub, un article Medium… Le site affiche un lien vers l'original.",
        ["Oui, je vais les indiquer", "Non", "Garder celles déjà en ligne"]],
      item: (i) => "Publication n°" + (i + 1) + " : de quoi s'agit-il ?",
      encore: "As-tu une autre publication à ajouter ?",
      resume: (x) => x.title,
      ajouts: [["Oui, en ajouter une"]]
    });

    // ── Blog ────────────────────────────────────────────────
    boucle(L, "articles", {
      choix: ["Veux-tu publier des articles sur ton blog dès maintenant ?", "Tu pourras toujours en écrire plus tard depuis le back-office, avec une mise en forme riche.",
        ["Oui, j'en ai un ou plusieurs", "Non, pas pour l'instant", "Garder ceux déjà en ligne"]],
      item: (i) => "Article n°" + (i + 1),
      encore: "As-tu un autre article à publier ?",
      resume: (x) => x.title,
      ajouts: [["Oui, en ajouter un"]]
    });

    // ── FAQ ─────────────────────────────────────────────────
    boucle(L, "faq", {
      choix: ["Veux-tu répondre aux questions que tes clients se posent souvent ?", "Elles s'affichent dans une section « Questions fréquentes ».",
        ["Oui, je vais les écrire", "Non", "Garder celles déjà en ligne"]],
      item: (i) => "Question fréquente n°" + (i + 1),
      encore: "Y a-t-il une autre question qu'on te pose souvent ?",
      resume: (x) => x.question,
      ajouts: [["Oui, en ajouter une"]]
    });

    // ── Témoignages ─────────────────────────────────────────
    boucle(L, "temoignages", {
      choix: ["Des clients ou des collègues t'ont-ils laissé un avis que tu peux publier ?",
        "Uniquement des avis réels, avec l'accord de leur auteur. Les deux avis actuellement sur le site sont des exemples fictifs : répondre « Non » les retire.",
        ["Oui, je vais les recopier", "Non, pas encore", "Garder ceux déjà en ligne"]],
      item: (i) => "Témoignage n°" + (i + 1),
      encore: "As-tu un autre témoignage ?",
      resume: (x) => [x.name, x.company].filter(Boolean).join(" — "),
      ajouts: [["Oui, en ajouter un"]]
    });

    // ── Ton site ────────────────────────────────────────────
    L.push({ cle: "sections", chap: "site", question: "Dernière question : quelles sections veux-tu afficher sur ton site ?",
      aide: "J'ai présélectionné celles pour lesquelles tu as du contenu. Une section masquée garde son contenu en base : tu pourras la réafficher depuis le back-office.",
      rendu: rSections });

    L.push({ cle: "recap", chap: "recap", rendu: rRecap, sansNav: true });
    return L;
  }

  /** Question d'entrée d'une section de liste : oui / non / garder. */
  function ecranChoix(liste, question, aide, textes) {
    const e = etat;
    const detailGarder = "Rien ne changera dans cette section du site.";
    return { cle: liste + ".choix", chap: liste, question, aide, sansSuivant: true,
      rendu: (c) => {
        c.appendChild(options([
          { texte: textes[0], actif: e.choix[liste] === "oui", action: () => choisir(liste, "oui") },
          { texte: textes[1], actif: e.choix[liste] === "non", action: () => choisir(liste, "non"),
            detail: e.listes[liste].length ? "Ce que tu as déjà saisi ici est conservé, au cas où tu changerais d'avis." : null },
          { texte: textes[2], actif: e.choix[liste] === "garder", action: () => choisir(liste, "garder"), detail: detailGarder }
        ]));
      } };
  }

  function choisir(liste, valeur) {
    etat.choix[liste] = valeur;
    // Dans le parcours, la première étape demande sa nature : on ne crée
    // rien avant la réponse.
    if (valeur === "oui" && !etat.listes[liste].length && !["reseaux", "competences", "parcours"].includes(liste)) {
      etat.listes[liste].push(MODELE[liste].nouveau());
    }
    sauvegarder();
    suivant();
  }

  /**
   * Boucle d'entretien : choix → un écran par élément → « un autre ? ».
   */
  function boucle(L, liste, o) {
    const e = etat;
    L.push(ecranChoix(liste, o.choix[0], o.choix[1], o.choix[2]));
    if (e.choix[liste] !== "oui") return;

    if (o.premier && !e.listes[liste].length) {
      L.push({ cle: liste + ".premier", chap: liste, question: o.premier, sansSuivant: true,
        valider: () => e.listes[liste].length ? "" : "Choisis une réponse.",
        rendu: (c) => c.appendChild(options(o.ajouts.map(([t, type]) => ({ texte: t.replace(/^Oui, /, "").replace(/^./, (m) => m.toUpperCase()),
          action: () => { e.listes[liste].push(MODELE[liste].nouveau(type)); sauvegarder(); aller(liste + ".0"); } })))) });
      return;
    }

    e.listes[liste].forEach((x, i) => {
      L.push({ cle: liste + "." + i, chap: liste, question: o.item(i, x), liste, index: i,
        champs: champsVisibles(liste, x).map((c) => champ(x, c, liste + "." + i, () => erreursCroisees(liste, x))),
        rendu: liste === "parcours" ? (corps, ecran, construire) => rEtapeParcours(corps, ecran, x, construire) : null });
    });

    L.push({ cle: liste + ".encore", chap: liste, question: o.encore, sansSuivant: true,
      rendu: (c) => {
        const recap = el("ul", { classe: "liste-resume" });
        e.listes[liste].forEach((x, i) => recap.appendChild(el("li", {},
          el("span", { texte: (i + 1) + ". " + (o.resume(x) || "(sans titre)") }),
          el("button", { classe: "btn-lien", type: "button", texte: "Modifier", onclick: () => aller(liste + "." + i) }))));
        c.appendChild(recap);
        c.appendChild(options(o.ajouts.map(([t, type]) => ({ texte: t,
          action: () => { e.listes[liste].push(MODELE[liste].nouveau(type)); sauvegarder(); aller(liste + "." + (e.listes[liste].length - 1)); } }))
          .concat([{ texte: "Non, c'est tout", action: () => suivant() }])));
      } });
  }

  /* ── Rendus sur mesure ──────────────────────────────────── */
  function rIntro(c) {
    const reprise = etat.position !== "intro";
    c.appendChild(el("p", { classe: "surtitre", texte: "Bienvenue" }));
    c.appendChild(el("h2", { classe: "question", tabindex: "-1", texte: reprise ? "Content de te revoir." : "Construisons ton portfolio ensemble." }));
    c.appendChild(el("p", { classe: "aide-question", texte: reprise
      ? "Tes réponses précédentes sont toujours là. Tu peux reprendre où tu t'étais arrêté, ou revoir l'ensemble au récapitulatif."
      : "Je vais te poser des questions sur toi, ton travail et ce que tu veux montrer. Tes réponses serviront à remplir le site automatiquement. Compte une vingtaine de minutes ; tu peux t'arrêter quand tu veux, tout est gardé dans ce navigateur." }));
    const corps = el("div", { classe: "corps" });
    const liste = reprise
      ? [{ texte: "Reprendre où j'en étais", action: () => aller(etat.positionPrecedente || etat.position || "nom") },
         { texte: "Voir le récapitulatif", action: () => aller("recap") },
         { texte: "Reprendre depuis un fichier", detail: "Un mes-infos.json téléchargé précédemment.", action: ouvrirImport }]
      : [{ texte: "Commencer", action: () => aller("nom") },
         { texte: "Reprendre depuis un fichier", detail: "Un mes-infos.json téléchargé précédemment.", action: ouvrirImport }];
    corps.appendChild(options(liste));
    c.appendChild(corps);
  }

  function rReseaux(c) {
    const e = etat;
    const actifs = new Set(e.listes.reseaux.filter((x) => !x.perso).map((x) => x.platform));
    c.appendChild(puces(PLATEFORMES.map(([nom, icone]) => ({ texte: nom, actif: actifs.has(nom),
      action: () => {
        const i = e.listes.reseaux.findIndex((x) => !x.perso && x.platform === nom);
        if (i >= 0) {
          if (e.listes.reseaux[i].url.trim() && !confirm("Retirer " + nom + " et l'adresse déjà saisie ?")) return;
          e.listes.reseaux.splice(i, 1);
        } else {
          e.listes.reseaux.push({ platform: nom, url: "", iconName: icone, active: true, perso: false });
        }
        sauvegarder(); rafraichir();
      } }))));
    const perso = e.listes.reseaux.filter((x) => x.perso).length;
    c.appendChild(el("button", { classe: "btn btn-ajout", type: "button",
      texte: perso ? "+ Un autre réseau qui n'est pas dans la liste (" + perso + " ajouté" + (perso > 1 ? "s" : "") + ")" : "+ Un réseau qui n'est pas dans la liste",
      onclick: () => { e.listes.reseaux.push(MODELE.reseaux.nouveau()); sauvegarder(); rafraichir(); } }));
  }

  function rLiensReseaux(corps, ecran, construire) {
    const e = etat;
    let k = 0;
    e.listes.reseaux.forEach((x, i) => {
      const n = x.perso ? 3 : 1;
      const boites = ecran.champs.slice(k, k + n).map(construire);
      k += n;
      if (!x.perso) { boites.forEach((b) => corps.appendChild(b)); return; }
      corps.appendChild(el("div", { classe: "carte" },
        el("div", { classe: "carte-tete" }, el("h3", { texte: "Autre réseau" }),
          el("button", { classe: "btn-lien danger", type: "button", texte: "Retirer",
            onclick: () => { e.listes.reseaux.splice(i, 1); sauvegarder(); rafraichir(); } })),
        el("div", { classe: "grille deux" }, ...boites)));
    });
  }

  function rDomaines(c) {
    const e = etat;
    const tous = [...new Set(DOMAINES.concat(e.domaines))];
    c.appendChild(puces(tous.map((d) => ({ texte: d, actif: e.domaines.includes(d),
      action: () => {
        if (e.domaines.includes(d)) {
          const n = e.listes.competences.filter((x) => x.category === d).length;
          if (n && !confirm("Retirer « " + d + " » et ses " + n + " compétence(s) ?")) return;
          e.domaines = e.domaines.filter((x) => x !== d);
          e.listes.competences = e.listes.competences.filter((x) => x.category !== d);
        } else {
          e.domaines.push(d);
          e.listes.competences.push(Object.assign(MODELE.competences.nouveau(), { category: d }));
        }
        sauvegarder(); rafraichir();
      } }))));
    const saisie = el("input", { type: "text", placeholder: "Un autre domaine…", "aria-label": "Ajouter un domaine" });
    const ajouter = () => {
      const d = saisie.value.trim();
      if (!d) return;
      if (!e.domaines.includes(d)) {
        e.domaines.push(d);
        e.listes.competences.push(Object.assign(MODELE.competences.nouveau(), { category: d }));
      }
      sauvegarder(); rafraichir();
    };
    saisie.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); ev.stopPropagation(); ajouter(); } });
    c.appendChild(el("div", { classe: "champ", style: "grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.5rem" },
      saisie, el("button", { classe: "btn", type: "button", texte: "Ajouter", onclick: ajouter })));
  }

  function rDomaine(corps, domaine, items, ecran, construire) {
    const e = etat;
    let k = 0;
    items.forEach(([x, i]) => {
      const boites = ecran.champs.slice(k, k + 2).map(construire);
      k += 2;
      corps.appendChild(el("div", { classe: "rangee" },
        el("div", { classe: "grille" }, ...boites),
        el("button", { classe: "btn-lien danger", type: "button", texte: "Retirer", "aria-label": "Retirer " + (x.name || "cette compétence"),
          onclick: () => { e.listes.competences.splice(i, 1); sauvegarder(); rafraichir(); } })));
    });
    corps.appendChild(el("button", { classe: "btn btn-ajout", type: "button", texte: "+ Ajouter une compétence en « " + domaine + " »",
      onclick: () => {
        e.listes.competences.push(Object.assign(MODELE.competences.nouveau(), { category: domaine }));
        sauvegarder(); rafraichir(true);
      } }));
  }

  function rEtapeParcours(corps, ecran, x, construire) {
    // Nature de l'étape en tête : elle change les questions suivantes.
    corps.appendChild(puces([["work", "Expérience professionnelle"], ["education", "Formation"]].map(([v, t]) => ({
      texte: t, actif: x.type === v, action: () => { x.type = v; sauvegarder(); rafraichir(); } }))));
    ecran.champs.forEach((ch) => corps.appendChild(construire(ch)));
  }

  /** Visibilité des sections : réglée par l'utilisateur, ou déduite. */
  function sectionsEffectives() {
    if (etat.sections) return etat.sections;
    const s = {};
    SECTIONS_SITE.forEach(([id, , liste]) => {
      if (!liste) { s[id] = true; return; }
      const c = etat.choix[liste];
      s[id] = c === "oui" ? etat.listes[liste].length > 0 : c !== "non";
    });
    return s;
  }

  function rSections(c) {
    const s = sectionsEffectives();
    c.appendChild(puces(SECTIONS_SITE.map(([id, nom]) => ({ texte: nom, actif: !!s[id],
      action: () => { etat.sections = Object.assign({}, sectionsEffectives(), { [id]: !s[id] }); sauvegarder(); rafraichir(); } }))));
  }

  /* ═══ 6. NAVIGATION ═══════════════════════════════════════════════ */
  let ecranCourant = null;
  let boitesCourantes = [];

  function trouver(cle) {
    const liste = ecrans();
    let i = liste.findIndex((x) => x.cle === cle);
    if (i < 0) {
      // Écran disparu (élément supprimé…) : premier écran du même chapitre.
      const chap = String(cle).split(".")[0];
      i = liste.findIndex((x) => x.chap === chap);
    }
    return { liste, i: i < 0 ? 0 : i };
  }

  function aller(cle, garderDefilement) {
    const { liste, i } = trouver(cle);
    const ecran = liste[i];
    ecranCourant = ecran;
    if (ecran.cle !== "intro") {
      if (etat.position !== ecran.cle && ecran.cle !== "recap") etat.positionPrecedente = ecran.cle;
      etat.position = ecran.cle;
      sauvegarder();
    }

    const zone = document.getElementById("ecran");
    zone.textContent = "";
    // Relance l'animation d'apparition.
    zone.classList.remove("ecran"); void zone.offsetWidth; zone.classList.add("ecran");
    boitesCourantes = [];

    const idx = CHAPITRES.findIndex((ch) => ch[0] === ecran.chap);
    const construire = (ch) => {
      const b = construireChamp(Object.assign({}, ch, {
        seul: ecran.champs && ecran.champs.length === 1 && !ecran.rendu,
        question: ecran.question,
        apresSaisie: (cleChamp) => {
          // Les règles croisées et les champs conditionnels dépendent de
          // plusieurs réponses.
          if (cleChamp === "current") { rafraichir(); return; }
          boitesCourantes.forEach((autre) => autre.afficher());
          majBoutonSuivant();
        }
      }));
      boitesCourantes.push(b);
      return b;
    };

    if (ecran.sansNav) {
      ecran.rendu(zone, ecran, construire);
    } else {
      zone.appendChild(el("p", { classe: "surtitre", texte: CHAPITRES[idx][1] + " · " + (idx + 1) + "/" + (CHAPITRES.length - 1) }));
      zone.appendChild(el("h2", { classe: "question", tabindex: "-1", id: "question", texte: ecran.question }));
      if (ecran.aide) zone.appendChild(el("p", { classe: "aide-question", texte: ecran.aide }));
      const corps = el("div", { classe: "corps" });
      if (ecran.rendu) ecran.rendu(corps, ecran, construire);
      else (ecran.champs || []).forEach((ch) => corps.appendChild(construire(ch)));
      zone.appendChild(corps);
      const avertissement = el("p", { classe: "note ko", id: "avertissement", hidden: true, role: "alert" });
      zone.appendChild(avertissement);
      zone.appendChild(navigation(ecran, liste, i));
    }
    boitesCourantes.forEach((b) => b.afficher());
    majProgression(idx);

    if (!garderDefilement) window.scrollTo({ top: 0 });
    const premier = zone.querySelector(".corps input:not([type=checkbox]):not([type=range]), .corps textarea, .corps select");
    const titre = zone.querySelector(".question");
    // Sur écran tactile, ouvrir le clavier à chaque question masquerait la
    // question elle-même : on ne focalise le champ qu'avec un pointeur fin.
    if (premier && matchMedia("(pointer: fine)").matches && !ecran.rendu) premier.focus({ preventScroll: true });
    else if (titre) titre.focus({ preventScroll: true });
  }

  /** Redessine l'écran courant (après un ajout, un retrait…). */
  function rafraichir(focaliserDernier) {
    const y = window.scrollY;
    aller(ecranCourant.cle, true);
    window.scrollTo({ top: y });
    if (focaliserDernier) {
      const champs = document.querySelectorAll(".corps input[type=text]");
      if (champs.length) { const d = champs[champs.length - 1]; d.focus({ preventScroll: true }); d.scrollIntoView({ block: "center" }); }
    }
  }

  function navigation(ecran, liste, i) {
    const nav = el("div", { classe: "nav-ecran" });
    if (i > 0) nav.appendChild(el("button", { classe: "btn btn-discret", type: "button", texte: "← Retour", onclick: precedent }));
    const droite = el("div", { classe: "droite" });
    if (ecran.index !== undefined) {
      droite.appendChild(el("button", { classe: "btn-lien danger", type: "button", texte: "Supprimer",
        onclick: () => supprimerElement(ecran.liste, ecran.index) }));
    }
    if (!ecran.sansSuivant) {
      droite.appendChild(el("span", { classe: "indice", texte: "Entrée ↵" }));
      droite.appendChild(el("button", { classe: "btn btn-plein", type: "button", id: "btn-suivant",
        texte: libelleSuivant(ecran, liste, i), onclick: suivant }));
    }
    nav.appendChild(droite);
    return nav;
  }

  /** « Passer » tant qu'un écran facultatif est vide, « Continuer » sinon. */
  function libelleSuivant(ecran, liste, i) {
    const facultatif = ecran.champs && ecran.champs.length && ecran.champs.every((c) => !c.def.requis)
      && ecran.champs.every((c) => c.def.type === "bool" || !String(c.objet[c.def.cle] || "").trim());
    if (facultatif) return "Passer";
    return liste[i + 1] && liste[i + 1].cle === "recap" ? "Voir le récapitulatif" : "Continuer";
  }
  function majBoutonSuivant() {
    const b = document.getElementById("btn-suivant");
    if (!b || !ecranCourant) return;
    const { liste, i } = trouver(ecranCourant.cle);
    b.textContent = libelleSuivant(ecranCourant, liste, i);
  }

  function supprimerElement(liste, index) {
    const x = etat.listes[liste][index];
    const rempli = MODELE[liste].champs.some((c) => !c.cache && c.type !== "bool" && String(x[c.cle] || "").trim());
    if (rempli && !confirm("Supprimer cet élément ?")) return;
    etat.listes[liste].splice(index, 1);
    if (!etat.listes[liste].length) delete etat.choix[liste];
    sauvegarder();
    aller(etat.listes[liste].length ? liste + ".encore" : liste + ".choix");
  }

  function verifierEcran(ecran) {
    let premierInvalide = null;
    boitesCourantes.forEach((b) => {
      touches[b.dataset.champ] = true;
      const m = b.afficher();
      if (m && !premierInvalide) premierInvalide = b;
    });
    const avert = document.getElementById("avertissement");
    const m = ecran.valider ? ecran.valider() : "";
    if (avert) { avert.hidden = !m; avert.textContent = m || ""; }
    if (premierInvalide) {
      premierInvalide.scrollIntoView({ block: "center" });
      const s = premierInvalide.querySelector("input, select, textarea");
      if (s) s.focus({ preventScroll: true });
      return false;
    }
    return !m;
  }

  function suivant() {
    if (!ecranCourant || ecranCourant.sansNav) return;
    if (!ecranCourant.sansSuivant && !verifierEcran(ecranCourant)) return;
    // Recalcul : la réponse donnée peut avoir ajouté ou retiré des écrans.
    const { liste, i } = trouver(ecranCourant.cle);
    const prochain = liste[i + 1];
    if (prochain) aller(prochain.cle);
  }

  function precedent() {
    const { liste, i } = trouver(ecranCourant.cle);
    if (i > 0) aller(liste[i - 1].cle);
  }

  function majProgression(idxChap) {
    const p = Math.max(0, idxChap) / (CHAPITRES.length - 1) * 100;
    document.getElementById("barre").style.width = p + "%";
    document.getElementById("progression").setAttribute("aria-valuenow", String(Math.round(p)));
  }

  document.addEventListener("keydown", (ev) => {
    if (document.getElementById("sommaire").open || !ecranCourant) return;
    const t = ev.target;
    // Entrée dans un champ d'une ligne, ou Ctrl/Cmd + Entrée partout.
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
      const ligne = t.tagName === "INPUT" && !["checkbox", "range", "file"].includes(t.type);
      if (ligne || ev.ctrlKey || ev.metaKey) {
        if (!ecranCourant.sansSuivant) { ev.preventDefault(); suivant(); }
        return;
      }
    }
    // A, B, C… choisissent une option, hors saisie de texte.
    const enSaisie = ["INPUT", "TEXTAREA", "SELECT"].includes(t.tagName);
    if (!enSaisie && !ev.ctrlKey && !ev.metaKey && !ev.altKey && /^[a-z]$/i.test(ev.key)) {
      const b = document.querySelector('.option[data-touche="' + ev.key.toUpperCase() + '"]');
      if (b) { ev.preventDefault(); b.click(); }
    }
  });

  /* ═══ RÉCAPITULATIF ═══════════════════════════════════════════════ */
  /** Toutes les erreurs du parcours, écran par écran. */
  function toutesLesErreurs() {
    const out = [];
    ecrans().forEach((ecran) => {
      (ecran.champs || []).forEach((c) => {
        const m = erreurChamp(c.def, c.objet[c.def.cle]) || (c.croise ? c.croise()[c.def.cle] : "");
        if (m) out.push({ ecran: ecran.cle, texte: ecran.question + (libelle(c.def, c.objet) ? " — " + libelle(c.def, c.objet) : "") + " : " + m });
      });
      const m = ecran.valider ? ecran.valider() : "";
      if (m) out.push({ ecran: ecran.cle, texte: ecran.question + " : " + m });
    });
    return out;
  }

  function rRecap(c) {
    const e = etat;
    const erreurs = toutesLesErreurs();
    c.appendChild(el("p", { classe: "surtitre", texte: "Récapitulatif" }));
    c.appendChild(el("h2", { classe: "question", tabindex: "-1", texte: "Voici ce que j'ai retenu." }));
    c.appendChild(el("p", { classe: "aide-question", texte: "Relis tranquillement ; « Modifier » te ramène à la question concernée. Rien n'est envoyé où que ce soit depuis cette page." }));

    const recap = el("div", { classe: "recap corps" });
    const bloc = (titre, cle, lignes) => {
      const dl = el("dl");
      lignes.forEach(([k, v]) => dl.appendChild(el("div", {}, el("dt", { texte: k }), v instanceof Node ? el("dd", {}, v) : el("dd", { texte: v || "—" }))));
      recap.appendChild(el("div", { classe: "carte" },
        el("div", { classe: "carte-tete" }, el("h3", { texte: titre }),
          el("button", { classe: "btn-lien", type: "button", texte: "Modifier", onclick: () => aller(cle) })), dl));
    };
    const coupe = (s, n) => (s = String(s || "").trim()).length > n ? s.slice(0, n) + "…" : s;

    bloc("Toi", "nom", [["Nom", e.profil.name], ["Titre", e.profil.title], ["Présentation", coupe(e.profil.bio, 180)],
      ["Lieu", e.profil.location]]);
    bloc("Te joindre", "contact", [["E-mail", e.profil.email], ["Téléphone", e.profil.phone]]);
    bloc("Images et CV", "photo", [["Photo", e.profil.photoUrl], ["Illustration", e.profil.aboutPhotoUrl], ["Logo", e.profil.logoUrl], ["CV", e.profil.cvUrl]]);
    bloc("Tes chiffres", "chiffres", [["Projets", e.parametres.stats_projects || "inchangé"], ["Années", e.parametres.stats_years || "inchangé"],
      ["Technologies", e.parametres.stats_techs || "inchangé"]]);

    const noms = {
      reseaux: ["Réseaux", (x) => x.platform], services: ["Services", (x) => x.title],
      competences: ["Compétences", (x) => x.name + " (" + x.category + ", " + x.level + " %)"],
      parcours: ["Parcours", (x) => [x.title, x.organization].filter(Boolean).join(" — ")],
      projets: ["Projets", (x) => x.title], publications: ["Publications", (x) => x.title],
      articles: ["Blog", (x) => x.title], faq: ["FAQ", (x) => x.question], temoignages: ["Témoignages", (x) => x.name]
    };
    LISTES.forEach((l) => {
      const [titre, nom] = noms[l];
      const ch = e.choix[l];
      let etatTxt, classe = "etat";
      if (ch === "oui") etatTxt = e.listes[l].length + " élément(s) — remplaceront ceux du site";
      else if (ch === "non") { etatTxt = "Aucun — la section sera vidée"; classe += " vide"; }
      else if (ch === "garder") { etatTxt = "Inchangée — on garde ce qui est en ligne"; classe += " garde"; }
      else { etatTxt = "Pas encore répondu — ce qui est en ligne est conservé"; classe += " garde"; }
      const lignes = [["Réponse", el("span", { classe, texte: etatTxt })]];
      if (ch === "oui" && e.listes[l].length) lignes.push(["Contenu", e.listes[l].map(nom).filter(Boolean).join(" · ")]);
      bloc(titre, l + ".choix", lignes);
    });
    const s = sectionsEffectives();
    bloc("Ton site", "sections", [["Sections affichées", SECTIONS_SITE.filter(([id]) => s[id]).map(([, n]) => n).join(", ") || "aucune"]]);
    c.appendChild(recap);

    const fin = el("div", { classe: "corps" });
    if (erreurs.length) {
      const liste = el("ul", { classe: "erreurs" });
      erreurs.forEach((er) => liste.appendChild(el("li", {}, el("button", { type: "button", texte: er.texte, onclick: () => aller(er.ecran) }))));
      fin.appendChild(el("div", { classe: "carte" },
        el("p", { classe: "note ko", texte: erreurs.length + " réponse(s) à compléter ou corriger avant de générer le fichier. Clique sur une ligne pour y aller." }), liste));
    } else {
      const json = JSON.stringify(construireFichier(), null, 2);
      fin.appendChild(el("div", { classe: "carte" },
        el("p", { classe: "note ok", texte: "Tout est prêt. Télécharge le fichier de tes réponses." }),
        el("div", { classe: "nav-ecran", style: "margin-top:1rem;justify-content:flex-start" },
          el("button", { classe: "btn btn-plein", type: "button", texte: "Télécharger mes-infos.json", onclick: () => { telecharger(json); toast("Fichier téléchargé"); } }),
          el("button", { classe: "btn", type: "button", texte: "Copier le contenu", onclick: () => copier(json).then(() => toast("Contenu copié"), () => toast("Copie impossible — utilise le téléchargement")) }))));
      fin.appendChild(el("div", { classe: "carte" },
        el("h3", { texte: "Et ensuite ?", style: "font-size:1rem;margin-bottom:.875rem" }),
        el("ol", { classe: "etapes" },
          el("li", {}, "Place le fichier téléchargé dans le projet, sous ce nom exact :", el("pre", { classe: "commande", texte: "prisma/donnees/mes-infos.json" })),
          el("li", {}, "Fais un essai à blanc : tout est écrit puis annulé, rien ne change en base.", el("pre", { classe: "commande", texte: "npm run db:injecter:simulation" })),
          el("li", {}, "Si le tableau affiché te convient, injecte pour de bon :", el("pre", { classe: "commande", texte: "npm run db:injecter" })))));
    }
    fin.appendChild(el("div", { classe: "nav-ecran", style: "margin-top:.5rem" },
      el("button", { classe: "btn btn-discret", type: "button", texte: "← Retour aux questions", onclick: () => aller("sections") }),
      el("button", { classe: "btn-lien danger", type: "button", texte: "Effacer mes réponses", onclick: () => {
        if (!confirm("Effacer toutes tes réponses de ce navigateur ?")) return;
        try { localStorage.removeItem(CLE); localStorage.removeItem(ANCIENNE_CLE); } catch (err) { /* stockage indisponible */ }
        remplacerEtat(etatVide()); aller("intro"); toast("Réponses effacées");
      } })));
    c.appendChild(fin);
  }

  /* ═══ EXPORT ══════════════════════════════════════════════════════ */
  function valeurFichier(def, v) {
    const s = typeof v === "string" ? v.trim() : v;
    switch (def.type) {
      case "bool": return !!v;
      case "liste": case "listeLiens": return decouper(s);
      case "entier": case "niveau": return s === "" || s === null || s === undefined ? null : Number(s);
      case "choix": return def.cle === "rating" ? Number(s) : s;
      default: return s === "" || s === null || s === undefined ? null : s;
    }
  }

  function construireFichier() {
    const e = etat;
    const p = e.profil;
    const vide = (v) => { const s = String(v || "").trim(); return s || null; };
    const f = { version: 1, profil: {
      name: p.name.trim(), title: p.title.trim(), bio: p.bio.trim(),
      email: vide(p.email), phone: vide(p.phone), location: vide(p.location),
      photoUrl: vide(p.photoUrl), aboutPhotoUrl: vide(p.aboutPhotoUrl), logoUrl: vide(p.logoUrl), cvUrl: vide(p.cvUrl),
      isAvailable: p.isAvailable !== false
    } };
    const pa = { site_name: vide(e.parametres.site_name) || p.name.trim() };
    ["stats_projects", "stats_years", "stats_techs"].forEach((k) => { const v = String(e.parametres[k] || "").trim(); if (v) pa[k] = Number(v); });
    pa.sections = Object.assign({}, sectionsEffectives());
    f.parametres = pa;

    LISTES.forEach((l) => {
      const ch = e.choix[l];
      if (ch === "non") { f[l] = []; return; }
      if (ch !== "oui") return;               // « garder » ou sans réponse : section absente
      f[l] = e.listes[l].map((x) => {
        const o = {};
        MODELE[l].champs.forEach((c) => {
          const v = valeurFichier(c, x[c.cle]);
          if (v === null && c.omettre) return;
          o[c.cle] = v;
        });
        if (l === "parcours" && o.current) o.endDate = null;
        return o;
      });
    });
    return f;
  }

  function telecharger(texte) {
    const url = URL.createObjectURL(new Blob([texte], { type: "application/json" }));
    const a = el("a", { href: url, download: "mes-infos.json" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function copier(texte) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texte);
    const zone = el("textarea", { style: "position:fixed;opacity:0" });
    zone.value = texte; document.body.appendChild(zone); zone.select();
    const ok = document.execCommand("copy"); zone.remove();
    return ok ? Promise.resolve() : Promise.reject(new Error("copie refusée"));
  }

  /* ═══ IMPORT ══════════════════════════════════════════════════════
     Relit un fichier au format du seed (un export précédent, ou
     `exemple.json`) : section présente et remplie → « oui », présente et
     vide → « non », absente → « garder ». */
  function versChamp(def, v) {
    if (def.type === "bool") return !!v;
    if (v === null || v === undefined) return "";
    if (Array.isArray(v)) return v.join(", ");
    return String(v);
  }

  function importer(f) {
    if (!f || typeof f !== "object" || f.version !== 1 || !f.profil) throw new Error("ce fichier n'est pas au format attendu (version 1)");
    const e = etatVide();
    Object.keys(e.profil).forEach((k) => {
      if (!(k in f.profil)) return;
      e.profil[k] = k === "isAvailable" ? !!f.profil[k] : versChamp({}, f.profil[k]);
    });
    const pa = f.parametres || {};
    Object.keys(e.parametres).forEach((k) => { if (k in pa) e.parametres[k] = versChamp({}, pa[k]); });
    if (pa.sections) { e.sections = {}; SECTIONS_SITE.forEach(([id]) => { e.sections[id] = pa.sections[id] !== false; }); }
    LISTES.forEach((l) => {
      if (!Array.isArray(f[l])) { e.choix[l] = "garder"; return; }
      e.choix[l] = f[l].length ? "oui" : "non";
      e.listes[l] = f[l].map((x) => {
        const item = MODELE[l].nouveau(x && x.type);
        MODELE[l].champs.forEach((c) => { if (x && c.cle in x) item[c.cle] = versChamp(c, x[c.cle]); });
        if (l === "reseaux") item.perso = !PLATEFORMES.some((p) => p[0] === item.platform);
        return item;
      });
    });
    e.domaines = [...new Set(e.listes.competences.map((c) => c.category).filter(Boolean))];
    e.position = "recap";
    return e;
  }

  function remplacerEtat(nouveau) { etat = nouveau; touches = {}; sauvegarder(); }

  function ouvrirImport() { document.getElementById("fichier-import").click(); }
  document.getElementById("btn-importer").addEventListener("click", () => { document.getElementById("sommaire").close(); ouvrirImport(); });
  document.getElementById("fichier-import").addEventListener("change", (ev) => {
    const fichier = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!fichier) return;
    if (fichier.size > 2 * 1024 * 1024) { toast("Fichier trop volumineux (2 Mo maximum)"); return; }
    fichier.text().then((texte) => {
      const nouveau = importer(JSON.parse(texte.replace(/^﻿/, "")));
      const dejaRempli = etat.profil.name || LISTES.some((l) => etat.listes[l].length);
      if (dejaRempli && !confirm("Remplacer tes réponses actuelles par celles de « " + fichier.name + " » ?")) return;
      remplacerEtat(nouveau);
      aller("recap");
      toast("Réponses reprises depuis le fichier");
    }).catch((err) => toast("Import impossible : " + (err && err.message ? err.message : "fichier illisible")));
  });

  /* ═══ SOMMAIRE ════════════════════════════════════════════════════ */
  function chapitreRepondu(chap) {
    const e = etat;
    if (LISTES.includes(chap)) return !!e.choix[chap];
    if (chap === "toi") return !!(e.profil.name && e.profil.title && e.profil.bio);
    if (chap === "contact") return !!(e.profil.email || e.profil.phone);
    if (chap === "visuels") return !!(e.profil.photoUrl || e.profil.aboutPhotoUrl || e.profil.logoUrl || e.profil.cvUrl);
    if (chap === "chiffres") return !!(e.parametres.stats_projects || e.parametres.stats_years || e.parametres.stats_techs);
    if (chap === "site") return !!e.sections;
    return false;
  }

  const dialogue = document.getElementById("sommaire");
  document.getElementById("btn-sommaire").addEventListener("click", () => {
    const ul = document.getElementById("sommaire-liste");
    ul.textContent = "";
    const liste = ecrans();
    CHAPITRES.forEach(([id, nom]) => {
      const premier = liste.find((x) => x.chap === id);
      if (!premier) return;
      ul.appendChild(el("li", {}, el("button", { type: "button", "aria-current": ecranCourant && ecranCourant.chap === id ? "true" : "false",
        onclick: () => { dialogue.close(); aller(premier.cle); } },
        el("span", { texte: nom }), chapitreRepondu(id) ? el("span", { classe: "fait", texte: "✓ répondu" }) : null)));
    });
    dialogue.showModal();
  });
  document.getElementById("fermer-sommaire").addEventListener("click", () => dialogue.close());

  aller("intro");
})();
</script>
</body>
